services:
  app:
    container_name: nextjs-app
    image: nextjs-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/app/.pnpm-store
      - build:/app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: sh -c "pnpm prisma migrate deploy && pnpm db:seed && pnpm dev"
    depends_on:
      - db
      - redis

  db:
    container_name: postgres
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  node_modules:
  pnpm-store:
  build:
  pgdata:
  redisdata:
